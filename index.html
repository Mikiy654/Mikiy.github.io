<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;

      padding: 60px 20px;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #2563eb;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hello, I’m Your Name</h1>

    <p>Welcome to my personal website.</p>

    <h2>About Me</h2>
    <p>
      I am learning web development and building projects with HTML and CSS.
    </p>

    <h2>Contact</h2>
    <p>
      Email me at:
      <a href="mailto:you@example.com">you@example.com</a>
    </p>
  </div>
</body>
</html>
